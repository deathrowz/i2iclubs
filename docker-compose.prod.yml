version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: schoolclubs-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:3005:3000"
    environment:
      - NODE_ENV=production
      # Reach Kong over the Docker network instead of the public proxy.
      - SUPABASE_INTERNAL_URL=http://supabase-kong:8000
      - NEXT_PUBLIC_SUPABASE_URL=https://161.118.247.101.sslip.io
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - WHATSAPP_ACCESS_TOKEN=${WHATSAPP_ACCESS_TOKEN}
      - WHATSAPP_PHONE_NUMBER_ID=${WHATSAPP_PHONE_NUMBER_ID}
      - WHATSAPP_VERIFY_TOKEN=${WHATSAPP_VERIFY_TOKEN}
      - WHATSAPP_APP_SECRET=${WHATSAPP_APP_SECRET}
    networks:
      - supabase_default
      - default

  caddy:
    image: caddy:2-alpine
    container_name: schoolclubs-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - supabase_default
      - default

volumes:
  caddy_data:
  caddy_config:

networks:
  supabase_default:
    external: true

name: CI/CD — Verify & Publish Circular-Economy Pilot Site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  verify-and-test:
    name: 1. TypeScript, RBAC/EXIF Validation Tests & Full-Stack Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript Static Analysis
        run: npx tsc --noEmit

      - name: Run 7-Step Validation, EXIF & RBAC Unit Test Suite
        env:
          WHATSAPP_APP_SECRET: 'giz-i2i-test-secret-1234567890'
          WHATSAPP_VERIFY_TOKEN: 'i2i-clubs-verify-token-2026'
        run: npm test

      - name: Verify Full-Stack Next.js Build (App Router + API Routes)
        run: npm run build

  publish-pilot-site:
    name: 2. Build & Publish Interactive Pilot Site (gh-pages & GitHub Pages)
    needs: verify-and-test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Static Export Bundle for GitHub Pages (Isomorphic Client Mode)
        env:
          GITHUB_PAGES: 'true'
          NEXT_PUBLIC_BASE_PATH: '/${{ github.event.repository.name }}'
          NEXT_PUBLIC_SUPABASE_URL: 'https://161.118.247.101.sslip.io'
          NEXT_PUBLIC_SUPABASE_ANON_KEY: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRxcmRodnJ1bm1udWZ4cGN4bnVxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE3OTcwNDcsImV4cCI6MjEwNzM3MzA0N30.vZ7QF5DLf1KG_pDA9p_b_dsZ2ELG30im1NeoI365dAg'
        run: |
          cp -r src/app/api /tmp/nextjs-api-routes-backup
          rm -rf src/app/api
          npm run build
          touch out/.nojekyll
          cp -r /tmp/nextjs-api-routes-backup src/app/api

      - name: Publish Static Site Bundle to gh-pages Branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          force_orphan: true
          commit_message: 'deploy: publish Next.js static export to gh-pages'

      - name: Enable & Configure GitHub Pages
        id: config_pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
        continue-on-error: true

      - name: Upload GitHub Pages Artifact (when Pages Actions mode is enabled)
        if: steps.config_pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: './out'

      - name: Deploy to GitHub Pages Environment (when Pages Actions mode is enabled)
        if: steps.config_pages.outcome == 'success'
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Write Deployment Summary
        run: |
          echo "## 🚀 I2I Clubs (Idea2Impact) Pilot Site Published" >> $GITHUB_STEP_SUMMARY
          echo "- **Static Export Branch:** Published to [\`gh-pages\`](https://github.com/${{ github.repository }}/tree/gh-pages)" >> $GITHUB_STEP_SUMMARY
          echo "- **Live Site URL:** \`https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/\`" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.config_pages.outcome }}" != "success" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "> **One-Time GitHub Settings Step:** To activate the public URL on this new repository, open [**Settings → Pages**](https://github.com/${{ github.repository }}/settings/pages) and set **Branch** to \`gh-pages\` (or set **Source** to **GitHub Actions**)." >> $GITHUB_STEP_SUMMARY
          fi
